spring:
  application:
    name: hirehub-backend

  datasource:
    url: jdbc:mysql://localhost:3306/hirehub
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
server:
  port: 8080

app:
  storage:
    upload-dir: uploads
    max-file-size: 5MB